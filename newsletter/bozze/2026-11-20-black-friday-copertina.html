<!doctype html><html lang="it"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#0e0e0d;font-family:'Inter Display','Inter',sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 600px at 50% 45%,rgba(255,212,0,.10),transparent 70%),
 repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px)}
.pct{position:absolute;font-weight:900;color:rgba(255,255,255,.05);font-size:520px;line-height:1;top:150px}
.pct.sx{left:-60px}.pct.dx{right:-40px}
.tag{position:absolute;width:150px;height:84px;border:3px solid rgba(255,212,0,.22);border-radius:14px 44px 44px 14px;transform:rotate(-14deg)}
.tag::after{content:"";position:absolute;right:20px;top:31px;width:16px;height:16px;border-radius:50%;border:3px solid rgba(255,212,0,.22)}
.t1{left:120px;top:90px}.t2{left:250px;top:690px;transform:rotate(11deg)}.t3{right:150px;top:110px;transform:rotate(16deg)}.t4{right:230px;top:700px;transform:rotate(-8deg)}
.c{position:absolute;left:440px;top:60px;width:720px;height:780px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.lab{font-weight:800;font-size:34px;letter-spacing:.32em;color:#ffd400;margin-bottom:6px;padding-left:.32em}
.solo{font-weight:900;font-size:110px;line-height:1;letter-spacing:-.01em;color:#fff;margin-top:4px}
.num{font-weight:900;font-size:250px;line-height:.9;letter-spacing:-.04em;color:#ffd400}
.txt{font-weight:900;font-size:84px;line-height:1.02;letter-spacing:-.015em;margin-top:22px;text-transform:uppercase}
.fonte{margin-top:34px;font-weight:500;font-size:24px;color:rgba(255,255,255,.62)}
</style></head><body><div class="bg"></div>
<div class="pct sx">%</div><div class="pct dx">%</div>
<div class="tag t1"></div><div class="tag t2"></div><div class="tag t3"></div><div class="tag t4"></div>
<div class="c"><div class="lab">BLACK FRIDAY</div><div class="solo">SOLO</div><div class="num">1,4%</div>
<div class="txt">sa leggere<br>uno sconto</div>
<div class="fonte">Indagine Altroconsumo su 2.017 consumatori, ottobre 2026</div></div>
</body></html>
